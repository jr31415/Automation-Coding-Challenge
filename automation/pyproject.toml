[project]
name = "automation"
version = "0.1.0"
description = "Computer-use automation system: LLM-driven discovery, deterministic replay, and human escalation for legacy back-office UIs."
readme = "README.md"
authors = [
    { name = "jr31415", email = "jacob@rosen4.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "playwright>=1.48.0",
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
discover = "automation.cli.discover:main"
replay = "automation.cli.replay:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
